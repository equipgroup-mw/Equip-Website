# ============================================================================
#  Pages CMS configuration — Equip Group website
#  ---------------------------------------------------------------------------
#  Every entry below points at a content file that already exists in this
#  repository.  Nothing is created, moved or renamed by this config.
#
#  Why every entry is `type: file` (not `collection`):
#  Every content set on this site lives in ONE JSON file (data/*.json) whose
#  top level is an object holding an array (e.g. { "_instructions": ..., "articles": [...] }).
#  A Pages CMS collection needs a FOLDER of same-schema files, which this repo
#  does not have (there are no Markdown posts and no content/ folder).  Each
#  JSON file is therefore exposed as a `file` entry with `format: json`, and the
#  array inside it is exposed as a repeated (`list: true`) object field.  That
#  keeps the stored JSON byte-shape identical, so the site's existing JS keeps
#  working after an edit.
#
#  Cross-links (related articles, podcast series id) are plain string id
#  lists, not `reference` fields: a Pages CMS `reference` is collection-backed
#  and this repo has no collections to point at.
#
#  NOTE: data/case-studies.json is intentionally NOT managed by this CMS for
#  now.  Edit it by hand until it is added back.
#
#  NOTE: Pages CMS rebuilds each file from the fields declared here, so any key
#  in a JSON file that is not declared below is dropped on save.  Keep this
#  config in step with the data files.
# ============================================================================

# Image paths are stored relative (no leading slash) to match the data files.
# The FIRST media entry is the default for image fields; other folders are
# selected per field with `options: { media: <name> }`.
media:
  - name: images
    input: assets/images
    output: assets/images
  - name: logos
    input: assets/logos
    output: assets/logos
  - name: data-division
    input: assets/data-division
    output: assets/data-division

content:
  # ==========================================================================
  #  Site
  # ==========================================================================
  - name: site
    label: Site
    type: group
    items:
      # ------------------------------------------------------------------
      - name: navigation
        label: Navigation & Departments
        type: file
        path: data/nav.json
        format: json
        fields:
          - name: _instructions
            label: Editor Instructions
            type: text
          - name: departments
            label: Departments
            type: object
            list: true
            fields:
              - name: name
                label: Department Name
                type: string
                required: true
              - name: description
                label: Short Description
                type: text
              - name: external
                label: External Link
                type: boolean
              - name: path
                label: Internal Path
                type: string
              - name: url
                label: External URL
                type: string

      # ------------------------------------------------------------------
      - name: testimonials
        label: Testimonials
        type: file
        path: data/testimonials.json
        format: json
        fields:
          - name: _instructions
            label: Editor Instructions
            type: text
          - name: testimonials
            label: Testimonials
            type: object
            list: true
            fields:
              - name: quote
                label: Quote
                type: text
                required: true
              - name: name
                label: Name
                type: string
                required: true
              - name: title
                label: Title / Role
                type: string
                required: true

      # ------------------------------------------------------------------
      - name: logos
        label: Partner Logos
        type: file
        path: data/logos.json
        format: json
        fields:
          - name: _instructions
            label: Editor Instructions
            type: text
          - name: logos
            label: Logos
            type: object
            list: true
            fields:
              - name: name
                label: Organization Name
                type: string
                required: true
              - name: image
                label: Logo Image
                type: image
                required: true
                options:
                  media: logos

      # ------------------------------------------------------------------
      - name: team
        label: Team Members
        type: file
        path: data/team.json
        format: json
        fields:
          - name: _instructions
            label: Editor Instructions
            type: text
          - name: team
            label: Team Members
            type: object
            list: true
            fields:
              - name: name
                label: Name
                type: string
                required: true
              - name: role
                label: Role
                type: string
                required: true
              - name: photo
                label: Photo
                type: image
                required: true
              - name: bio
                label: Bio
                type: text
              - name: linkedin
                label: LinkedIn URL
                type: string
              - name: expertise
                label: Expertise
                type: string
                list: true

  # ==========================================================================
  #  Editorial
  # ==========================================================================
  - name: editorial
    label: Editorial
    type: group
    items:
      # ------------------------------------------------------------------
      - name: articles
        label: Articles
        type: file
        path: data/articles.json
        format: json
        fields:
          - name: _instructions
            label: Editor Instructions
            type: text
          - name: articles
            label: Articles
            type: object
            list: true
            fields:
              - name: id
                label: Article ID (slug)
                type: string
                required: true
                description: "Slug used by the page as article.html?id=<id>. Use lowercase letters, digits and dashes."
                pattern:
                  regex: '^[a-z0-9]+(-[a-z0-9]+)*$'
                  message: "Use lowercase letters, digits and dashes only (e.g. my-first-article)."
              - name: title
                label: Title
                type: string
                required: true
              - name: author
                label: Author
                type: string
                description: "Shown as 'By <author>'. Leave empty to fall back to 'EQUIP Team'."
              - name: excerpt
                label: Excerpt
                type: text
                required: true
              - name: date
                label: Publish Date
                type: date
                required: true
              - name: readTime
                label: Read Time
                type: string
              - name: tags
                label: Tags
                type: string
                list: true
              - name: mainImage
                label: Main Image
                component: image-with-alt-caption-portal
                required: true
              - name: sections
                label: Sections
                type: object
                list: true
                fields:
                  - name: heading
                    label: Section Heading
                    type: string
                    required: true
                  - name: body
                    label: Body Text
                    type: text
                    required: true
                  - name: image
                    label: Section Image
                    component: image-with-alt-caption-portal
              - name: pullQuote
                label: Pull Quote
                type: text
              - name: related
                label: Related Article IDs
                type: string
                list: true
                description: "Article ids (the `id` field of another article). Stored in the data file but not rendered by the current article template."

      # ------------------------------------------------------------------
      - name: updates
        label: Updates & News
        type: file
        path: data/updates.json
        format: json
        fields:
          - name: _instructions
            label: Editor Instructions
            type: text
          - name: podcastSeries
            label: Podcast Series
            type: object
            list: true
            fields:
              - name: id
                label: Series ID
                type: string
                required: true
              - name: title
                label: Series Title
                type: string
                required: true
              - name: description
                label: Series Description
                type: text
              - name: coverArt
                label: Cover Art
                type: image
              - name: totalEpisodes
                label: Total Episodes
                type: number
              - name: latestEpisodeDate
                label: Latest Episode Date
                type: date
              - name: people
                label: People
                type: string
                list: true
              - name: links
                label: Links
                component: streaming-links
          - name: items
            label: Update Items
            type: object
            list: true
            fields:
              - name: type
                label: Item Type
                type: select
                options:
                  - article
                  - announcement
                  - opportunity
                  - podcast
                  - webinar
                required: true
              - name: title
                label: Title
                type: string
                required: true
              - name: date
                label: Date
                type: date
                required: true
              - name: excerpt
                label: Excerpt
                type: text
                required: true
              - name: image
                label: Image
                type: image
              - name: embedUrl
                label: Embed URL
                type: string
              - name: link
                label: Link
                type: string
              - name: deadline
                label: Deadline
                type: date
              - name: links
                label: Links
                component: streaming-links
              - name: seriesId
                label: Series ID
                type: string
                description: "Must match the `id` of a podcast series above (used by podcast cards)."
              - name: episodeNumber
                label: Episode Number
                type: number
              - name: imagePosition
                label: Image Position
                type: string
                description: "CSS object-position for the thumbnail (e.g. 'center top'). Optional."

  # ==========================================================================
  #  Data Division
  # ==========================================================================
  - name: data-division
    label: Data Division
    type: group
    items:
      - name: catalogue
        label: Portal Catalogue
        type: file
        path: data/data-division.json
        format: json
        fields:
          # In data-division.json this key must be ONE text string (not an object).
          - name: _instructions
            label: Editor Instructions
            type: text
          - name: sectors
            label: Sectors
            type: string
            list: true
          - name: how_to_choose_a_chart_type
            label: Optional data fields (unit / prefix)
            type: text
          - name: items
            label: Catalogue Items
            type: object
            list: true
            fields:
              - name: id
                label: Item ID
                type: string
                required: true
                description: "Used as the portal anchor: data-division.html#item-<id>. Use lowercase letters, digits and dashes."
                pattern:
                  regex: '^[a-z0-9]+(-[a-z0-9]+)*$'
                  message: "Use lowercase letters, digits and dashes only (e.g. fuel-africa)."
              - name: title
                label: Title
                type: string
                required: true
              - name: type
                label: Content Type
                type: select
                options:
                  - image
                  - chart
                  - dashboard
                  - article
                required: true
              - name: category
                label: Category
                type: select
                options:
                  - Dashboards
                  - Datasets & Visuals
                required: true
              - name: updated
                label: Updated (YYYY-MM)
                type: string
                required: true
                description: "Month the visual or data was last refreshed, e.g. 2026-09. Shown as 'Updated: Sep, 2026'."
                pattern:
                  regex: '^\d{4}-(0[1-9]|1[0-2])$'
                  message: "Use the format YYYY-MM, e.g. 2026-09."
              - name: mode
                label: Mode
                type: select
                options:
                  - static
                  - interactive
                required: true
                description: "Use 'interactive' for embeds and anything clickable; 'static' for images, charts and plain datasets."
              - name: sector
                label: Sector
                type: string
              - name: description
                label: Description
                type: text
              - name: image
                label: Image
                type: image
                description: "Only for items of type 'image'."
                options:
                  media: data-division
              - name: embedUrl
                label: Embed URL
                type: string
                description: "Only for items of type 'dashboard'."
              - name: link
                label: Link
                type: string
                description: "Only for items of type 'article'."
              - name: source
                label: Source
                type: string
              - name: sourceUrl
                label: Source URL
                type: string
              - name: provider
                label: Provider
                type: string
              - name: chartType
                label: Chart Type
                type: select
                description: "Only for items of type 'chart'."
                options:
                  - bar
                  - line
                  - pie
              - name: labels
                label: Chart Labels
                type: string
                list: true
                description: "Only for charts. One label per value in each series."
              - name: series
                label: Chart Series
                type: object
                list: true
                description: "Only for charts. Each series needs the same number of values as there are labels."
                fields:
                  - name: name
                    label: Series Name
                    type: string
                  - name: data
                    label: Data Values
                    type: number
                    list: true
                  - name: color
                    label: Colour override (hex)
                    type: string
                    description: "Optional. Leave empty to use the brand palette."
              - name: unit
                label: Unit Suffix
                type: string
                description: "Attached to values with no space when '%', with a space otherwise (e.g. 'kg')."
              - name: prefix
                label: Value Prefix
                type: string
                description: "Attached to values as written (e.g. '$' or 'MWW ')."
              - name: sortDescending
                label: Sort Descending
                type: boolean
                description: "Ranks bar charts biggest first."
              - name: xAxisTitle
                label: X Axis Title
                type: string
              - name: yAxisTitle
                label: Y Axis Title
                type: string

components:
  image-with-alt-caption-portal:
    type: object
    label: Image
    fields:
      - name: src
        label: Image Path
        type: image
        required: true
      - name: alt
        label: Alt Text
        type: string
        required: true
      - name: caption
        label: Caption
        type: text
      - name: portalUrl
        label: Data Division Portal URL
        type: string
        description: "Optional deep link into the portal, e.g. services/data-division.html#item-fuel-africa"

  streaming-links:
    type: object
    label: Links
    fields:
      - name: spotify
        label: Spotify URL
        type: string
      - name: apple
        label: Apple Podcasts URL (series)
        type: string
      - name: applePodcasts
        label: Apple Podcasts URL (episode)
        type: string
      - name: youtube
        label: YouTube URL
        type: string
      - name: zoom
        label: Zoom URL
        type: string
