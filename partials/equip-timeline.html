<style>
  /* ============================================================
     Scoped styles for the timeline partial.
     Everything is namespaced .eqt-* so it never leaks into the
     rest of about.html. Values mirror the original design.
     ============================================================ */
  .eqt-section {
    --eqt-bg: #e6e1da;
    --eqt-node-fill: #f3efe8;
    --eqt-navy: #0d2136;
    --eqt-text: #1a2c52;
    --eqt-gold: #a8935a;
    --eqt-gold-deep: #a8935a;
    --eqt-gold-soft: #d6bd86;
    --eqt-serif: Georgia, 'Times New Roman', serif;
    --eqt-sans: 'Libre Franklin', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --eqt-offset: 0px;

    position: relative;
    width: 100%;
    background: var(--eqt-bg);
    color: var(--eqt-text);
    overflow: hidden;
    font-family: var(--eqt-sans);
  }
  .eqt-section * { box-sizing: border-box; }

  /* ---------------- Replay button ---------------- */
  .eqt-replay {
    background: transparent;
    color: var(--eqt-gold-deep);
    border: 1px solid rgba(164, 123, 51, 0.55);
    padding: 6px 16px;
    border-radius: 999px;
    font: 600 11px/1 var(--eqt-sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .2s ease, color .2s ease;
    white-space: nowrap;
  }
  .eqt-replay:hover { background: var(--eqt-gold-deep); color: #fff; }
  .eqt-replay:focus-visible { outline: 2px solid var(--eqt-gold-deep); outline-offset: 3px; }

  /* ---------------- Desktop ---------------- */
    /* ---------------- Desktop ---------------- */
  .eqt-desktop { display: block; padding-top: clamp(1rem, 10vh, 13.5rem); }
  .eqt-desktop svg { display: block; width: 100%; height: 100%; }
  .eqt-replay-desktop { position: absolute; top: 20px; right: 28px; z-index: 5; }

  .eqt-mobile-head, .eqt-mobile-stage { display: none; }

  @media (min-width: 901px) and (min-aspect-ratio: 1/1) {
    /* Full-viewport height minus the site header (set via --eqt-offset by JS) */
    .eqt-section { height: calc(100vh - var(--eqt-offset)); height: calc(100dvh - var(--eqt-offset)); min-height: 520px; }
    .eqt-desktop { height: 100%; }
  }

  /* ---------------- SVG text styles ---------------- */
  .eqt-t-line { font-family: var(--eqt-serif); font-weight: 700; }
  .eqt-t-tag  { font-family: var(--eqt-serif); font-weight: 700; fill: var(--eqt-navy); }
  .eqt-t-sub  { font-family: var(--eqt-sans); fill: var(--eqt-text); }
  .eqt-year   { font-family: var(--eqt-serif); font-weight: 700; fill: var(--eqt-gold-deep); letter-spacing: 1px; }
  .eqt-desc   { font-family: var(--eqt-sans); font-weight: 400; fill: var(--eqt-text); }
  .eqt-icon   { color: var(--eqt-navy); }

  .eqt-node-ring { filter: drop-shadow(0 5px 9px rgba(90, 65, 20, 0.20)); }
  .eqt-node-hover { transform-box: fill-box; transform-origin: center; transition: transform .35s cubic-bezier(.34,1.56,.64,1); cursor: default; }
  .eqt-node:hover .eqt-node-hover { transform: scale(1.08); }

  /* ---------------- Mobile / portrait ---------------- */
  @media (max-width: 900px), (max-aspect-ratio: 1/1) {
    .eqt-section { padding: 48px 20px 40px; }
    .eqt-desktop, .eqt-replay-desktop { display: none; }
    .eqt-mobile-head { display: block; max-width: 640px; margin: 0 auto 32px; }
    .eqt-mobile-stage { display: block; }
  }

  .eqt-mh-1 { font: 700 clamp(40px, 12vw, 64px)/0.95 var(--eqt-serif); color: var(--eqt-navy); }
  .eqt-mh-2 { font: 700 clamp(40px, 12vw, 64px)/0.95 var(--eqt-serif); color: var(--eqt-gold); }
  .eqt-mh-rule { height: 1px; background: var(--eqt-gold); margin: 16px 0 14px; }
  .eqt-mh-tag { font: 700 clamp(18px, 5vw, 24px)/1.2 var(--eqt-serif); color: var(--eqt-navy); margin-bottom: 8px; }
  .eqt-mh-sub { font: 400 15px/1.5 var(--eqt-sans); color: var(--eqt-text); margin-bottom: 14px; }
  .eqt-mobile-head .eqt-replay { margin-top: 4px; }

  .eqt-mobile-stage { position: relative; max-width: 640px; margin: 0 auto; padding: 8px 0 12px; }
  .eqt-m-track { position: absolute; top: 28px; bottom: 28px; left: 27px; width: 4px; background: rgba(176, 138, 69, 0.22); border-radius: 4px; }
  .eqt-m-fill { position: absolute; inset: 0 0 auto 0; height: 0%; background: linear-gradient(180deg, var(--eqt-gold-soft), var(--eqt-gold)); border-radius: 4px; transition: height .25s linear; }
  .eqt-m-list { list-style: none; display: flex; flex-direction: column; gap: 26px; padding: 0; margin: 0; }
  .eqt-m-item {
    position: relative; padding-left: 76px; opacity: .25; transform: translateY(14px);
    transition: opacity .5s cubic-bezier(.22,1,.36,1), transform .5s cubic-bezier(.22,1,.36,1);
  }
  .eqt-m-item.eqt-revealed { opacity: 1; transform: none; }
  .eqt-m-node {
    position: absolute; left: 0; top: 0; width: 58px; height: 58px; border-radius: 50%;
    background: var(--eqt-node-fill); border: 2.5px solid var(--eqt-gold); color: var(--eqt-navy);
    display: grid; place-items: center; z-index: 2; transform: scale(.8);
    transition: transform .45s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease;
  }
  .eqt-m-node svg { width: 32px; height: 32px; }
  .eqt-m-item.eqt-revealed .eqt-m-node { transform: scale(1); box-shadow: 0 0 0 6px rgba(176,138,69,.16), 0 6px 12px rgba(90,65,20,.15); }
  .eqt-m-card { background: rgba(255,255,255,.38); border: 1px solid rgba(176,138,69,.3); border-radius: 12px; padding: 14px 18px; }
  .eqt-m-year { display: block; font: 700 22px/1.1 var(--eqt-serif); color: var(--eqt-gold-deep); margin-bottom: 4px; }
  .eqt-m-desc { font: 400 15px/1.55 var(--eqt-sans); color: var(--eqt-text); margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .eqt-m-item, .eqt-m-node, .eqt-m-fill, .eqt-node-hover { transition: none; }
  }
</style>
