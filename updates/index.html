<!DOCTYPE html>
<html lang="en" data-root="../">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Updates</title>
<meta name="description" content="Articles, announcements, opportunities, podcasts and webinars from Equip Group.">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" type="image/avif" href="../assets/logos/favicon.avif">
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js"></script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Blog",
  "name": "Equip Group Updates",
  "description": "Articles, announcements, opportunities, podcasts and webinars from Equip Group.",
  "publisher": { "@type": "Organization", "name": "Equip Group", "url": "https://equipgroup.co" },
  "blogPosts": [
    { "@type": "BlogPosting", "headline": "Equip Insights Podcast", "description": "Conversations with leaders shaping Malawi's economy." },
    { "@type": "BlogPosting", "headline": "Business Unfiltered Podcast", "description": "Raw, practical conversations with Malawian founders." }
  ]
}
</script>
</head>
<body>
<div id="header-slot"></div>

<main id="main">
  <section class="hero hero--compact hero--updates" data-hero>
    <div class="hero-bg"><img src="../assets/images/hero-updates.avif" alt="" onerror="this.style.opacity=0"></div>
    <div class="hero-inner">
      <div class="hero-content">
        <h1>Welcome to our Updates</h1>
        <p class="hero-lede">Stay current with Equip's news, research, opportunities, podcasts and webinars — all in one place.</p>
      </div>
      <div class="feature-list cols-3">
        <button type="button" class="feature-item" data-shortcut="articles-announcements"><h4>Articles &amp; announcements <span class="feature-arrow" aria-hidden="true">→</span></h4><p>Research, insights and news from across the firm.</p></button>
        <button type="button" class="feature-item" data-shortcut="opportunities"><h4>Opportunities <span class="feature-arrow" aria-hidden="true">→</span></h4><p>Open consultant calls and ways to work with us.</p></button>
        <button type="button" class="feature-item" data-shortcut="podcasts-webinars"><h4>Podcasts &amp; webinars <span class="feature-arrow" aria-hidden="true">→</span></h4><p>Recorded conversations and sessions, waiting for you to watch and listen.</p></button>
      </div>
    </div>
    <div class="scroll-cue" aria-hidden="true"><span>Scroll</span><span class="line"></span></div>
  </section>

  <div class="dd-toolbar updates-toolbar">
    <div class="container dd-toolbar-inner">
      <div class="dd-search">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="ddSearch" placeholder="Search updates…" aria-label="Search updates">
      </div>
      <div class="dd-tabs" id="ddTabs"></div>
      <div class="up-sort">
        <label class="up-sort-label" for="upSort">Sort by</label>
        <select id="upSort" class="up-sort-select">
          <option value="newest" selected>Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="title-asc">Title A to Z</option>
          <option value="title-desc">Title Z to A</option>
        </select>
      </div>
      <span class="dd-count" id="ddCount"></span>
    </div>
  </div>

  <section class="section" style="padding-top:1.5rem; padding-bottom:1.5rem;">
    <div class="container">
      <h2 class="visually-hidden" id="updatesGridHeading" tabindex="-1">Results</h2>
      <div class="grid grid-3" id="updatesGrid"></div>
      <nav class="up-pagination" id="upPagination" aria-label="Updates pages" hidden>
        <button type="button" class="up-page-btn" id="upPrev" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <span class="up-page-info" id="upPageInfo" aria-live="polite"></span>
        <button type="button" class="up-page-btn" id="upNext" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.5"/></svg></button>
      </nav>
    </div>
  </section>

  <section style="padding-block:4rem; border-top:1px solid rgba(246,244,238,.12); background-image: url('../assets/images/discover.webp'); background-size: cover; background-position: center;">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1.5rem;">
      <h3 class="mt-0" style="max-width:26ch; color:#a8935a;">Have something for us to feature?</h3>
      <a href="../contact.html" class="btn btn-gold">Let's talk</a>
    </div>
  </section>
</main>

<div id="footer-slot"></div>
<script src="../js/main.js"></script>
<script src="../js/updates.js"></script>
<script type="module">
  const ROOT = document.documentElement.dataset.root || '';
  import { initHeroAnimations } from '../js/hero-animations.js';
  initHeroAnimations();
</script>
</body>
</html>
